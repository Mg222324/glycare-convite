<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlyCare · Convite</title>
<style>
  :root{--bg:#0B0A24;--s:#13122E;--b:rgba(255,255,255,.08);--ac:#7C5CFF;--g:#4FD1A5;--r:#FF6B6B;--t:#F5F3FF;--m:#A5A3C7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:var(--bg);color:var(--t);padding:20px;min-height:100vh}
  main{max-width:560px;margin:0 auto}
  .card{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:22px;margin-bottom:14px}
  h1{font-size:22px;margin-bottom:8px} h2{font-size:15px;margin-bottom:12px}
  p,li{color:var(--m);font-size:14px;line-height:22px}
  .big{font-size:36px;font-weight:700;color:var(--t)} .ok{color:var(--g)} .bad{color:var(--r)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
  .grid b{display:block;font-size:20px;color:var(--t)} .grid span{font-size:11px;color:var(--m)}
  ul{list-style:none} li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)}
  li:last-child{border:0} svg{width:100%;height:auto}
  .logo{font-weight:700;color:var(--ac);margin-bottom:16px;letter-spacing:.5px}
</style>
</head>
<body>
<main id="app"><div class="logo">GlyCare</div><div class="card"><p>Carregando…</p></div></main>
<script>

const FUNCTION_URL = "https://oragsoghgnzvntghktfn.supabase.co/functions/v1/convite-publico";

const app = document.getElementById("app");
const q = new URLSearchParams(location.search);
const token = q.get("token"), acao = q.get("acao") || "ver";

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === "class" ? (e.className = v) : e.setAttribute(k, v);
  kids.flat().forEach(k => e.append(k && k.nodeType ? k : document.createTextNode(k ?? "")));
  return e;
}
const card = (...k) => el("div", { class: "card" }, ...k);
const fmt = d => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const fmtDia = d => new Date(d).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
const show = (...k) => { app.replaceChildren(el("div", { class: "logo" }, "GlyCare"), ...k); };

async function chamar(a) {
  const r = await fetch(`${FUNCTION_URL}?token=${encodeURIComponent(token)}&acao=${a}`);
  return { ok: r.ok, d: await r.json() };
}

function grafico(pts) {
  if (pts.length < 2) return el("p", {}, "Poucas medições para o gráfico.");
  const W = 520, H = 160, min = 40, max = 260;
  const t0 = new Date(pts[0].medido_em).getTime(), t1 = new Date(pts[pts.length - 1].medido_em).getTime() || t0 + 1;
  const x = p => ((new Date(p.medido_em).getTime() - t0) / Math.max(1, t1 - t0)) * (W - 20) + 10;
  const y = p => H - ((Math.min(max, Math.max(min, p.valor)) - min) / (max - min)) * H;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H + 24}`);
  const poly = document.createElementNS(NS, "polyline");
  poly.setAttribute("points", pts.map(p => `${x(p)},${y(p)}`).join(" "));
  poly.setAttribute("fill", "none"); poly.setAttribute("stroke", "#7C5CFF"); poly.setAttribute("stroke-width", "2.5");
  svg.append(poly);
  [pts[0], pts[pts.length - 1]].forEach((p, i) => {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", i ? W - 10 : 10); t.setAttribute("y", H + 18); t.setAttribute("fill", "#A5A3C7");
    t.setAttribute("font-size", "12"); t.setAttribute("text-anchor", i ? "end" : "start");
    t.textContent = fmtDia(p.medido_em); svg.append(t);
  });
  return svg;
}

async function main() {
  if (!token) return show(card(el("h1", {}, "Link inválido"), el("p", {}, "Abra o link recebido por e-mail.")));
  try {
    if (acao === "aceitar" || acao === "recusar") {
      const { ok, d } = await chamar(acao);
      if (!ok) return show(card(el("h1", { class: "bad" }, "Não foi possível"), el("p", {}, d.erro || "Erro")));
      const aceito = d.status === "aceito";
      return show(card(
        el("h1", { class: aceito ? "ok" : "bad" }, aceito ? "Convite aceito!" : "Convite recusado"),
        el("p", {}, aceito ? `Você agora acompanha ${d.paciente}. Guarde o link “Ver dados compartilhados” do e-mail.` : "Nenhum dado foi compartilhado."),
        aceito ? el("p", {}, el("a", { href: `?token=${token}&acao=ver`, style: "color:#7C5CFF" }, "Ver dados agora")) : ""
      ));
    }
    const { ok, d } = await chamar("ver");
    if (!ok) return show(card(el("h1", {}, "Acesso indisponível"), el("p", {}, d.erro || "Erro")));
    const p = d.permissoes, out = [];
    out.push(card(el("h1", {}, d.paciente), el("p", {}, "Atualizado em " + fmt(d.atualizadoEm))));
    if (d.ultima) out.push(card(el("h2", {}, "Última glicemia"), el("div", { class: "big" }, d.ultima.valor + " mg/dL"), el("p", {}, fmt(d.ultima.medido_em))));
    if (d.resumo) out.push(card(el("h2", {}, "Resumo (30 dias)"), el("div", { class: "grid" },
      ["media:Média", "minima:Mínima", "maxima:Máxima"].map(s => { const [k, n] = s.split(":"); return el("div", {}, el("b", {}, d.resumo[k]), el("span", {}, n)); }),
    ), el("p", { style: "margin-top:10px" }, `${d.resumo.noAlvo}% das ${d.resumo.total} medições dentro do alvo (70–180 mg/dL).`)));
    if (d.alertas) out.push(card(el("h2", {}, "Alertas (7 dias)"), el("p", {}, `${d.alertas.altas} leitura(s) alta(s) · ${d.alertas.baixas} leitura(s) baixa(s)`)));
    if (d.grafico) out.push(card(el("h2", {}, "Gráfico (30 dias)"), grafico(d.grafico)));
    if (d.historico) out.push(card(el("h2", {}, "Histórico"), d.historico.length ? el("ul", {}, d.historico.map(h => el("li", {}, el("span", {}, fmt(h.medido_em) + (h.momento ? " · " + h.momento : "")), el("b", {}, h.valor + " mg/dL")))) : el("p", {}, "Sem medições.")));
    if (d.registros) out.push(card(el("h2", {}, "Alimentação, atividade e medicamentos"), d.registros.length ? el("ul", {}, d.registros.map(r => el("li", {}, el("span", {}, fmt(r.registrado_em) + " · " + r.tipo), el("span", {}, (r.dados && (r.dados.nome || r.dados.descricao || r.dados.tipo)) || "")))) : el("p", {}, "Sem registros.")));
    if (out.length === 1) out.push(card(el("p", {}, "Nenhuma informação foi liberada para você ainda.")));
    show(...out);
  } catch (e) {
    show(card(el("h1", {}, "Erro de conexão"), el("p", {}, "Tente novamente em instantes.")));
  }
}
main();
</script>
</body>
</html>
